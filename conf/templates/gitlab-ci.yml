deploy:
  stage: deploy
  # artifacts:
  #   untracked: true
  #   when: on_failure
  #   expire_in: 3 days
  #   paths:
  #     - target/
  #     - dist/
  script:
    - bash $HOME/runner/deploy.sh
    # - bash $HOME/runner/deploy.sh --deploy-rsync-ssh
    # - bash $HOME/runner/deploy.sh --deploy-rsync
    # - bash $HOME/runner/deploy.sh --deploy-ftp
    # - bash $HOME/runner/deploy.sh --deploy-sftp
  environment:
    name: ENV-${CI_COMMIT_REF_NAME}
  ## k8s namespace develops/testing/release/main
  ## 每个项目只限定在以下固定分支自动发布 CI/CD
  rules:
    ## 研发分支 develop, 对应 k8s 的 namespace develop， （dev 为等效别名 alias,不对应 namespace)
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "dev"'
    ## 测试分支 testing, 对应 k8s 的 namespace testing, (sit/test 均为等效别名 alias,不对应 namespace)
    - if: '$CI_COMMIT_BRANCH == "testing" || $CI_COMMIT_BRANCH == "test" || $CI_COMMIT_BRANCH == "sit"'
    ## 预发布分支 release, 对应 k8s 的 namespace release, (uat 均为等效别名 alias,不对应 namespace)
    - if: '$CI_COMMIT_BRANCH == "release" || $CI_COMMIT_BRANCH == "uat"'
    ## 特殊分支 发布到 阿里云 函数计算
    - if: '$CI_COMMIT_BRANCH =~ /^func.*$/'
    ## 生产分支 main, 对应 k8s 的 namespace main, (prod/master 均为等效别名 alias,不对应 namespace)
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "prod" || $CI_COMMIT_BRANCH == "master"'

