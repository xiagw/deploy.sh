# 静态前端 SPA 默认站点配置
# 由 repo_inject_file 注入到构建上下文，Dockerfile.web final 阶段覆盖 nginx:alpine 自带 default.conf
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/vnd.ms-fontobject application/font-woff font/ttf;

    location / {
        # SPA 路由 fallback：未命中的路径回退到 index.html，避免刷新/深链接 404
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的静态资源可长期缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
}
